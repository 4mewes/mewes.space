<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mewes.space</title>
    <script src="../pigeon/PigeonConfig.js"></script>
    <script src="../pigeon/MouseTracker.js"></script>
    <script src="../pigeon/BreadCrumbManager.js"></script>
    <script src="../pigeon/PNGRenderer.js"></script>
    <script src="../pigeon/Pigeon.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        padding: 20px 16px;
      }

      body > p,
      .download-section {
        position: relative;
        z-index: 2;
      }

      body > p {
        width: fit-content;
        max-width: calc(100vw - 32px);
        background: #fff;
        white-space: nowrap;
      }

      .scene-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .scene-layer img {
        position: absolute;
        display: block;
        width: var(--scene-width);
        max-width: none;
        height: auto;
        transform: rotate(var(--scene-rotation));
        filter: saturate(0.95);
      }

      .download-section {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 48px;
        text-align: center;
        width: fit-content;
        max-width: calc(100vw - 32px);
        margin: 0 auto;
        padding: 8px 10px;
        background: #fff;
      }

      .virus-download {
        display: inline-block;
        padding: 18px 28px;
        color: #00ff00;
        background: #111;
        border: 4px ridge #ff0000;
        box-shadow: 0 0 18px #ff0000, 8px 8px 0 #000;
        text-decoration: none;
        text-transform: uppercase;
      }

      .virus-download:hover {
        color: #ff0000;
        background: #00ff00;
      }

      .download-note {
        margin-top: 8px;
      }

      @media (max-width: 700px) {
        body {
          padding: 16px 12px 28px;
        }

        .download-section {
          bottom: 36px;
        }

        .virus-download {
          padding: 14px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene-layer" id="scene-layer" aria-hidden="true"></div>
    <p><a href="../index.html">Home</a></p>
    <p>if the internet wants to be a public space, it needs pigeons; <strong>click</strong> to feed</p>
    <section class="download-section">
      <a class="virus-download" href="https://chromewebstore.google.com/detail/ngmaagmlmbbkminhnlokimgmhpihodfm?utm_source=item-share-cb" target="_blank" rel="noopener noreferrer">Download now</a>
      <p class="download-note"><sub>(not a virus just my pigeon extension)</sub></p>
    </section>
    <script>
      const sceneImages = [
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.59.14.png",
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.57.38.png",
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.56.35.png",
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.58.38.png",
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.57.08.png",
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.59.48.png",
        "../media/pigeon/scenes/Screenshot 2026-06-03 at 14.57.21.png"
      ];
      const pigeons = [];
      const breadCrumbManager = new window.BreadCrumbManager(window.PIGEON_CONFIG);
      const sceneLayer = document.getElementById("scene-layer");
      const sceneSlots = [
        { x: 4, y: 26, width: 24, rotation: -3.5 },
        { x: 38, y: 4, width: 18, rotation: 2 },
        { x: 62, y: 9, width: 28, rotation: -1 },
        { x: 13, y: 38, width: 20, rotation: 3.5 },
        { x: 45, y: 31, width: 25, rotation: -2.5 },
        { x: 74, y: 54, width: 24, rotation: 2.8 },
        { x: 4, y: 66, width: 23, rotation: -1.8 }
      ];

      sceneImages.forEach((src, index) => {
        const image = document.createElement("img");
        const slot = sceneSlots[index % sceneSlots.length];

        image.src = src;
        image.alt = "";
        image.style.left = `${slot.x}vw`;
        image.style.top = `${slot.y}vh`;
        image.style.setProperty("--scene-width", `${slot.width}vw`);
        image.style.setProperty("--scene-rotation", `${slot.rotation}deg`);
        sceneLayer.appendChild(image);
      });

      breadCrumbManager.init();

      for (let i = 0; i < 10; i++) {
        pigeons.push(new window.Pigeon(
          new window.PNGRenderer(),
          window.PIGEON_CONFIG,
          window.MouseTracker,
          window.PIGEON_STATES,
          breadCrumbManager
        ));
      }

      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min((now - lastTime) / 16.67, 3);
        lastTime = now;

        pigeons.forEach((pigeon) => pigeon.update(dt));
        breadCrumbManager.update(dt);
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    </script>
  </body>
</html>
