<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Livecoding</title>
    <script src="https://unpkg.com/@strudel/repl@1.3.0"></script>
    <style>
      .page {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) 600px minmax(180px, 1fr);
        align-items: start;
        column-gap: 24px;
      }

      .intro {
        grid-column: 1;
      }

      .player {
        grid-column: 2;
        padding-top: 8px;
      }

      .strudel-embed {
        width: 600px;
        height: calc(100vh - 40px);
        margin: 0;
        overflow: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .strudel-embed::-webkit-scrollbar {
        display: none;
      }

      .strudel-embed > div {
        width: 750px;
        height: 900px;
        transform: scale(0.8);
        transform-origin: top left;
      }

      #play {
        position: fixed;
        right: 200px;
        top: 50vh;
        z-index: 10;
        background: #fff;
        border: 5px solid #000;
        box-shadow: 5px 5px 0 #000;
        padding: 14px 24px;
        image-rendering: pixelated;
        text-transform: uppercase;
        animation: hover-around 18s linear infinite;
      }

      #play:active {
        box-shadow: none;
        transform: translate(5px, 5px);
      }

      .song-controls {
        margin: 0 0 8px;
        text-align: center;
      }

      .song-controls button {
        padding: 0;
        font: inherit;
        color: LinkText;
        background: none;
        border: 0;
        text-decoration: underline;
      }

      .song-controls button + button {
        margin-left: 48px;
      }

      .song-controls button:active {
        color: ActiveText;
      }

      @media (max-width: 980px) {
        .page {
          display: block;
        }

        .player {
          padding-top: 0;
        }

        .strudel-embed {
          margin: 0 auto 24px;
        }
      }

      @keyframes hover-around {
        0% {
          translate: 0 0;
        }

        25% {
          translate: -80px 60px;
        }

        50% {
          translate: -30px -90px;
        }

        75% {
          translate: -120px -20px;
        }

        100% {
          translate: 0 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">

        </p>

      const visibleSongs = songs.filter((song) => !["mycelium", "sombrero"].includes(song.title));

      let currentSong = 0;

      customElements.whenDefined("strudel-editor").then(() => {
        const repl = document.createElement("strudel-editor");
        repl.id = "repl";
        repl.setAttribute("code", visibleSongs[currentSong].code);
        document.getElementById("strudel").append(repl);
        const playButton = document.getElementById("play");
        playButton.style.top = `${20 + Math.random() * 60}vh`;

        function showSong(index) {
          const wasPlaying = repl.editor && repl.editor.repl.scheduler.started;
          currentSong = (index + visibleSongs.length) % visibleSongs.length;
          repl.setAttribute("code", visibleSongs[currentSong].code);

          if (wasPlaying) {
            repl.editor.evaluate();
            playButton.textContent = "Stop";
          }
        }

        playButton.addEventListener("click", async () => {
          if (repl.editor.repl.scheduler.started) {
            await repl.editor.stop();
            playButton.textContent = "Play";
            return;
          }

          await repl.editor.evaluate();
          playButton.textContent = "Stop";
        });

        document.getElementById("previous-song").addEventListener("click", () => {
          showSong(currentSong - 1);
        });

        document.getElementById("next-song").addEventListener("click", () => {
          showSong(currentSong + 1);
        });

        const applyTheme = () => {
          if (repl.editor) {
            repl.editor.setTheme("bbedit");
            return;
          }

          requestAnimationFrame(applyTheme);
        };

        applyTheme();
        showSong(currentSong);
      });
