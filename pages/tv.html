<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>TV</title>
    <style>
      .tv {
        width: min(1100px, 100%);
        margin: 0 auto;
      }

      .player-frame {
        position: relative;
        width: 100%;
      }

      iframe {
        display: block;
        width: 100%;
        height: min(82vh, 900px);
        min-height: 720px;
        border: 0;
      }

      #watch {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        transform: translate(-50%, -50%);
        padding: 14px 28px;
      }

      #watch.is-hidden {
        display: none;
      }

      .controls {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: visible;
      }

      .controls button {
        position: absolute;
        top: 50%;
        z-index: 1;
        display: block;
        padding: 0;
        background: transparent;
        border: 0;
        transform: translateY(-50%);
        pointer-events: auto;
      }

      .controls button img {
        display: block;
        width: 84px;
        height: auto;
      }

      #previous {
        left: -96px;
      }

      #next {
        right: -96px;
      }

      @media (max-width: 900px) {
        iframe {
          height: 70vh;
          min-height: 0;
        }

        .controls button img {
          width: 64px;
        }

        #previous {
          left: -72px;
        }

        #next {
          right: -72px;
        }
      }
    </style>
  </head>
  <body>
    <p><a href="../index.html">Home</a></p>
    <p>like doomscrolling but curated by me</p>

    <div class="tv">
      <div class="player-frame">
        <button id="watch" type="button">watch</button>
        <iframe
          id="player"
          width="560"
          height="315"
          src="https://www.youtube-nocookie.com/embed/IXhmu1aQSOY?controls=0&playsinline=1&rel=0"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <div class="controls">
          <button id="previous" type="button" aria-label="Previous video">
            <img src="../media/gifs/gifs-used/point.left.gif" alt="">
          </button>
          <button id="next" type="button" aria-label="Next video">
            <img src="../media/gifs/gifs-used/point.right.gif" alt="">
          </button>
        </div>
      </div>
      <p><a id="youtube-link" href="https://www.youtube.com/watch?v=IXhmu1aQSOY&amp;list=PLu38iozJFpfViWNgpdBYMwFlNyvebEeaT">Open on YouTube</a></p>
    </div>

    <script>
      const videos = [
        "m2dJv6hqnk0",

        "LcV_1yklA2k",
        "vdtNY7krS7Y",
        "_WMB-qiSGmc",
        "rFtYzVJcWyA"
      ];

      const player = document.getElementById("player");
      const youtubeLink = document.getElementById("youtube-link");
      const watchButton = document.getElementById("watch");
      let currentVideo = 0;
      let canAutoplay = false;

      function getEmbedUrl(videoId, autoplay = canAutoplay) {
        const autoplayParam = autoplay ? "&autoplay=1" : "";
        return `https://www.youtube-nocookie.com/embed/${videoId}?controls=0&playsinline=1&rel=0${autoplayParam}`;
      }

      function showVideo(index, autoplay = canAutoplay) {
        currentVideo = (index + videos.length) % videos.length;
        player.src = getEmbedUrl(videos[currentVideo], autoplay);
        youtubeLink.href = `https://www.youtube.com/watch?v=${videos[currentVideo]}&list=PLu38iozJFpfViWNgpdBYMwFlNyvebEeaT`;
      }

      watchButton.addEventListener("click", () => {
        canAutoplay = true;
        watchButton.classList.add("is-hidden");
        showVideo(currentVideo, true);
      });

      document.getElementById("previous").addEventListener("click", () => {
        showVideo(currentVideo - 1);
      });

      document.getElementById("next").addEventListener("click", () => {
        showVideo(currentVideo + 1);
      });
    </script>
  </body>
</html>
