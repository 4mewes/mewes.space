<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>TV</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
      }

      .tv {
        width: min(1100px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .player-frame {
        position: relative;
        width: 100%;
      }

      iframe {
        position: relative;
        z-index: 0;
        display: block;
        width: 100%;
        height: min(62vh, 440px);
        min-height: 0;
        border: 0;
      }

      .player-frame:not(.is-playing) iframe {
        pointer-events: none;
      }

      #watch {
        display: block;
        margin: 0 auto 12px;
        padding: 0;
        background: transparent;
        border: 0;
        pointer-events: auto;
      }

      #watch img {
        display: block;
        width: 170px;
        height: auto;
      }

      #watch.is-hidden {
        display: none;
      }

      .controls {
        position: static;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        pointer-events: auto;
      }

      .controls button {
        position: static;
        z-index: 1;
        display: block;
        padding: 0;
        background: transparent;
        border: 0;
        transform: none;
        pointer-events: auto;
      }

      .controls button img {
        display: block;
        width: 84px;
        height: auto;
        transition: transform 120ms ease;
      }

      #previous:active img {
        transform: translateX(-6px);
      }

      #next:active img {
        transform: translateX(6px);
      }

      #previous {
        left: auto;
      }

      #next {
        right: auto;
      }

      @media (max-width: 900px) {
        .controls button img {
          width: 56px;
        }

        #watch img {
          width: 132px;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 12px;
        }

        .tv {
          width: 100%;
        }

        iframe {
          height: min(56vh, 360px);
        }
      }
    </style>
  </head>
  <body>
    <div class="tv">
      <p><a href="../index.html">Home</a></p>
      <p>like doomscrolling but curated by me</p>
      <button id="watch" type="button" aria-label="Watch" onclick="window.startWatchingTV && window.startWatchingTV()">
        <img src="../media/gifs/gifs-used/clickhere_blue.gif" alt="">
      </button>
      <div class="player-frame">
        <iframe
          id="player"
          width="560"
          height="315"
          src="about:blank"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <div class="controls">
          <button id="previous" type="button" aria-label="Previous video">
            <img src="../media/gifs/gifs-used/point.left.gif" alt="">
          </button>
          <button id="next" type="button" aria-label="Next video">
            <img src="../media/gifs/gifs-used/point.right.gif" alt="">
          </button>
        </div>
      </div>
    </div>

    <script>
      const videos = [
        "m2dJv6hqnk0",

        "LcV_1yklA2k",
        "vdtNY7krS7Y",
        "_WMB-qiSGmc",
        "rFtYzVJcWyA"
      ];

      const player = document.getElementById("player");
      const playerFrame = document.querySelector(".player-frame");
      const watchButton = document.getElementById("watch");
      let currentVideo = 0;
      let canAutoplay = false;
      let hasStartedWatching = false;

      function getEmbedUrl(videoId, autoplay = canAutoplay) {
        const autoplayParam = autoplay ? "&autoplay=1" : "";
        const origin = window.location.origin && window.location.origin !== "null"
          ? `&origin=${encodeURIComponent(window.location.origin)}`
          : "";
        return `https://www.youtube-nocookie.com/embed/${videoId}?controls=0&playsinline=1&rel=0&enablejsapi=1${origin}${autoplayParam}`;
      }

      function showVideo(index, autoplay = canAutoplay) {
        currentVideo = (index + videos.length) % videos.length;
        player.src = getEmbedUrl(videos[currentVideo], autoplay);
      }

      function startWatching() {
        if (hasStartedWatching) {
          return;
        }

        hasStartedWatching = true;
        canAutoplay = true;
        watchButton.classList.add("is-hidden");
        playerFrame.classList.add("is-playing");
        player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*");
      }

      window.startWatchingTV = startWatching;
      watchButton.addEventListener("click", startWatching);

      document.getElementById("previous").addEventListener("click", () => {
        showVideo(currentVideo - 1);
      });

      document.getElementById("next").addEventListener("click", () => {
        showVideo(currentVideo + 1);
      });

      showVideo(currentVideo, false);
    </script>
  </body>
</html>
