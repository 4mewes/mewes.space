<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>mewes-space</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
      }

      .tv {
        width: min(1100px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .player-frame {
        position: relative;
        width: 100%;
      }

      .video-shell {
        position: relative;
        width: 100%;
      }

      iframe {
        position: relative;
        z-index: 0;
        display: block;
        width: 100%;
        height: min(78vh, 760px);
        min-height: 0;
        border: 0;
      }

      .player-frame:not(.is-playing) iframe {
        pointer-events: none;
      }

      #watch {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        display: block;
        padding: 0;
        background: transparent;
        border: 0;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }

      #watch img {
        display: block;
        width: 170px;
        height: auto;
      }

      #watch.is-hidden {
        display: none;
      }

      .controls {
        position: static;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        pointer-events: auto;
      }

      .controls button {
        position: static;
        z-index: 1;
        display: block;
        padding: 0;
        background: transparent;
        border: 0;
        transform: none;
        pointer-events: auto;
      }

      .controls button img {
        display: block;
        width: 84px;
        height: auto;
        transition: transform 120ms ease;
      }

      #previous:active img {
        transform: translateX(-6px);
      }

      #next:active img {
        transform: translateX(6px);
      }

      #previous {
        left: auto;
      }

      #next {
        right: auto;
      }

      @media (max-width: 900px) {
        .controls button img {
          width: 56px;
        }

        #watch img {
          width: 132px;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 12px;
        }

        .tv {
          width: 100%;
        }

        iframe {
          height: min(56vh, 360px);
        }
      }
    </style>
  </head>
  <body>
    <div class="tv">
      <p><a href="../index.html">Home</a></p>
      <p>like doomscrolling but curated by me</p>
      <div class="player-frame">
        <div class="video-shell">
          <iframe
            id="player"
            width="560"
            height="315"
            src="about:blank"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
          <button id="watch" type="button" aria-label="Watch" onclick="window.startWatchingTV && window.startWatchingTV()">
            <img src="../media/gifs/gifs-used/clickhere_blue.gif" alt="">
          </button>
        </div>
        <div class="controls">
          <button id="previous" type="button" aria-label="Previous video">
            <img src="../media/gifs/gifs-used/point.left.gif" alt="">
          </button>
          <button id="next" type="button" aria-label="Next video">
            <img src="../media/gifs/gifs-used/point.right.gif" alt="">
          </button>
        </div>
      </div>
    </div>

    <script>
      const videos = [
        "m2dJv6hqnk0", // *F**F*U0ff08f80f0f8f8080800ooo00o0o
        "Oi3e3PlEJAs", // Lions Mane Mushroom Gets Cut While Playing Modular Synth
        "IXhmu1aQSOY", // Terry Davis - "What do you use Internet Explorer for?"
        "XYpG5SRzQag", // working at a coal mine for 60 cents an hour type beat
        "7IE2kM6vyAw", // 2^27 balls dropped inside a circle
        "6tGjpaqMnR8", // creepy balloon attacks me
        "lZbfNtDCHdM", // Hermeto Pascoal - Música da Lagoa (Sinfonia do Alto Ribeira, 1985)
        "K3k6thZz-NQ", // video essay: how to revert into a bird with lots hobbies and free time
        "wubkrBd3-gg", // Boards of Canada "Olson" on a 1959 PDP-1 Computer
        "_fW9uWFXRpQ", // Flashed Face Distortion Effect
        "kK0M74E8PS4", // Microsoft Office 95 - "Hall of Tortured Souls"
        "9CEsoEfzKfI", // Sabin Balasa -The Galaxy (1973)
        "NrPg8YNcXpI", // nor gather into barns
        "NZh5YxDpuK4", // Take Care
        "JMA6_Ne_B-g", // How To Forgive Yourself.
        "3FtkZLDPUDY", // Running MEMZ Virus on actual hardware
        "j3qMwnMtnhQ", // Mamoru Oshii's 'Angel's Egg' | Teaser
        "n7bC_kAR-wU", // Dog's Life (PS2) Ending
        "x6QV7CjvEe0", // "Dziady Noworoczne" (1981) /CAŁY FILM/
        "kEB11PQ9Eo8", // Non-Euclidean Worlds Engine
        "NM9KFRvA1Vg", // Periphylla, aliens of the deep
        "Bs8vLmo7Rsc", // Will Elmo Survive the Particle Accelerator?
        "xchmB7-fKSE", // digital intimacy
        "UnURElCzGc0", // Cosmos - Carl Sagan - 4th Dimension
        "jErtuROeUzM", // Pet Sounds
        "TFwXbp9bLlY", // My Movie
        "-2Jy24fIEJQ", // "Ghost cars" haunt Uber riders in China
        "t5_9Aa2GD0Q", // Extreme Egg Experiments
        "09wr-JaaVZ8", // behind the waterfall interlude
        "LcV_1yklA2k", // A day in the studio with clay artist Myrgon
        "vdtNY7krS7Y", // Circuit Bent Barbie Island by freeform delusion
        "_WMB-qiSGmc", // Shia LaBeouf #INTRODUCTIONS (2015) Full HD Video
        "rFtYzVJcWyA" // Eulers Disc
      ];

      const player = document.getElementById("player");
      const playerFrame = document.querySelector(".player-frame");
      const watchButton = document.getElementById("watch");
      let currentVideo = 0;
      let canAutoplay = false;
      let hasStartedWatching = false;

      function getEmbedUrl(videoId, autoplay = canAutoplay) {
        const autoplayParam = autoplay ? "&autoplay=1" : "";
        const origin = window.location.origin && window.location.origin !== "null"
          ? `&origin=${encodeURIComponent(window.location.origin)}`
          : "";
        return `https://www.youtube-nocookie.com/embed/${videoId}?controls=0&playsinline=1&rel=0&enablejsapi=1${origin}${autoplayParam}`;
      }

      function showVideo(index, autoplay = canAutoplay) {
        currentVideo = (index + videos.length) % videos.length;
        player.src = getEmbedUrl(videos[currentVideo], autoplay);
      }

      function startWatching() {
        if (hasStartedWatching) {
          return;
        }

        hasStartedWatching = true;
        canAutoplay = true;
        watchButton.classList.add("is-hidden");
        playerFrame.classList.add("is-playing");
        player.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', "*");
      }

      window.startWatchingTV = startWatching;
      watchButton.addEventListener("click", startWatching);

      document.getElementById("previous").addEventListener("click", () => {
        showVideo(currentVideo - 1);
      });

      document.getElementById("next").addEventListener("click", () => {
        showVideo(currentVideo + 1);
      });

      showVideo(currentVideo, false);
    </script>
  </body>
</html>
