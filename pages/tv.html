<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>TV</title>
    <style>
      .tv {
        width: min(1100px, 100%);
        margin: 0 auto;
      }

      .player-frame {
        position: relative;
        width: 100%;
      }

      iframe {
        display: block;
        width: 100%;
        height: min(82vh, 900px);
        min-height: 720px;
        border: 0;
      }

      #watch {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        transform: translate(-50%, -50%);
        padding: 14px 28px;
      }

      #watch.is-hidden {
        display: none;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
      }

      @media (max-width: 900px) {
        iframe {
          height: 70vh;
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <p><a href="../index.html">Home</a></p>
    <p>sometimes there is a movie playing</p>

    <div class="tv">
      <div class="player-frame">
        <button id="watch" type="button">watch</button>
        <iframe
          id="player"
          width="560"
          height="315"
          src="https://www.youtube-nocookie.com/embed/IXhmu1aQSOY?controls=0&playsinline=1&rel=0"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>

      <div class="controls">
        <button id="previous" type="button" aria-label="Previous video">&larr;</button>
        <button id="next" type="button" aria-label="Next video">&rarr;</button>
      </div>
      <p><a id="youtube-link" href="https://www.youtube.com/watch?v=IXhmu1aQSOY&amp;list=PLu38iozJFpfViWNgpdBYMwFlNyvebEeaT">Open on YouTube</a></p>
    </div>

    <script>
      const videos = [
        "IXhmu1aQSOY",
        "4d_FvgQ1csE",
        "fOIM1_xOSro",
        "ii6Qf6flkjI",
        "m2dJv6hqnk0",
        "sQhbqBdqkDI",
        "wubkrBd3-gg",
        "lZbfNtDCHdM",
        "XYpG5SRzQag",

        "9CEsoEfzKfI",
        "iAg4yMangmY",
        "kK0M74E8PS4",
        "n7bC_kAR-wU",
        "6tGjpaqMnR8",
        "Oi3e3PlEJAs",
        "Jr58Uf1srfo",
        "tvjt6Nhvz3g",
        "fA5D_175vHM",
        "sWblpsLZ-O8",
        "HQD2cMVuNWk",
        "JMA6_Ne_B-g",
        "3FtkZLDPUDY",
        "GwGJKNSP8Hk",
        "wJ3nZ018TWU",
        "j3qMwnMtnhQ",
        "4Ji3GmoeLrU",
        "NM9KFRvA1Vg",
        "_fW9uWFXRpQ",
        "x6QV7CjvEe0",
        "ZVDvowPQMWc",
        "0DVdDa0qKoc",
        "NrPg8YNcXpI",
        "NZh5YxDpuK4",
        "Bs8vLmo7Rsc",
        "xchmB7-fKSE",
        "0pl-1Eap6Qc",
        "UnURElCzGc0",
        "kEB11PQ9Eo8",
        "jErtuROeUzM",
        "-2Jy24fIEJQ",
        "t5_9Aa2GD0Q",
        "Ce5mRvkAePU",
        "TFwXbp9bLlY",
        "LcV_1yklA2k",
        "09wr-JaaVZ8"
      ];

      const player = document.getElementById("player");
      const youtubeLink = document.getElementById("youtube-link");
      const watchButton = document.getElementById("watch");
      let currentVideo = 0;
      let canAutoplay = false;

      function getEmbedUrl(videoId, autoplay = canAutoplay) {
        const autoplayParam = autoplay ? "&autoplay=1" : "";
        return `https://www.youtube-nocookie.com/embed/${videoId}?controls=0&playsinline=1&rel=0${autoplayParam}`;
      }

      function showVideo(index, autoplay = canAutoplay) {
        currentVideo = (index + videos.length) % videos.length;
        player.src = getEmbedUrl(videos[currentVideo], autoplay);
        youtubeLink.href = `https://www.youtube.com/watch?v=${videos[currentVideo]}&list=PLu38iozJFpfViWNgpdBYMwFlNyvebEeaT`;
      }

      watchButton.addEventListener("click", () => {
        canAutoplay = true;
        watchButton.classList.add("is-hidden");
        showVideo(currentVideo, true);
      });

      document.getElementById("previous").addEventListener("click", () => {
        showVideo(currentVideo - 1);
      });

      document.getElementById("next").addEventListener("click", () => {
        showVideo(currentVideo + 1);
      });
    </script>
  </body>
</html>
