<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pigeon Webring</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f3ea;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.45)),
          repeating-linear-gradient(90deg, rgba(45, 90, 100, 0.08) 0 1px, transparent 1px 96px),
          #f6f3ea;
      }

      main {
        width: min(680px, calc(100% - 32px));
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.2rem, 7vw, 4.4rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      p {
        max-width: 58ch;
        margin: 0 0 24px;
        font-size: 1rem;
        line-height: 1.65;
      }

      a {
        color: #17202a;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pigeon Webring</h1>
      <p>This is a placeholder page for the Pigeon Webring. It will eventually explain how the ring works and how to join.</p>
      <a href="./">Back to demo</a>
    </main>
  </body>
</html>
