<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pigeon Webring Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f3ea;
        color: #17202a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(255, 255, 255, 0.38)),
          repeating-linear-gradient(90deg, rgba(45, 90, 100, 0.08) 0 1px, transparent 1px 96px),
          #f6f3ea;
      }

      main {
        width: min(780px, calc(100% - 32px));
        margin: 0 auto;
        padding: 72px 0;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.3rem, 7vw, 5rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 62ch;
        font-size: 1rem;
        line-height: 1.65;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      pre {
        overflow-x: auto;
        padding: 16px;
        border: 1px solid rgba(23, 32, 42, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.76);
      }

      button {
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid rgba(23, 32, 42, 0.22);
        border-radius: 6px;
        background: #17202a;
        color: white;
        font: 700 0.92rem/1 system-ui, sans-serif;
        cursor: pointer;
      }

      button:hover {
        background: #263545;
      }
    </style>
    <script>
      window.PigeonWebring = {
        config: {
          initialDelayMs: 900,
          intervalMs: 12000
        }
      };
    </script>
    <script src="./pigeon-webring.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Pigeon Webring</h1>

      <button type="button" onclick="window.PigeonWebring && window.PigeonWebring.spawn()">Spawn pigeon</button>

      <h2>Embed</h2>
      <pre><code>&lt;script src="https://your-domain.example/pigeon-webring.js" defer&gt;&lt;/script&gt;</code></pre>
    </main>
  </body>
</html>
