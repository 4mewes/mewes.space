<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>My Website</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      body.guestbook-open {
        overflow: hidden;
      }

      nav {
        position: relative;
        width: 560px;
        height: 560px;
        border-radius: 50%;
      }

      a {
        position: absolute;
        color: #111;
        text-decoration: none;
        transform: translate(-50%, -50%);
      }

      a > span {
        display: inline-block;
      }

      .wobble:hover > span {
        animation: wobble 600ms ease-in-out;
      }

      .spin:hover > span {
        animation: spin 700ms linear;
      }

      .short-movement:hover > span {
        animation: short-movement 350ms ease-out;
      }

      .jump:hover > span {
        animation: jump 450ms ease-out;
      }

      .squash:hover > span {
        animation: squash 400ms ease-in-out;
      }

      .orbit:hover > span {
        animation: orbit 700ms linear;
      }

      .blink:hover > span {
        animation: blink 600ms steps(2, jump-none);
      }

      .flip:hover > span {
        animation: flip 600ms ease-in-out;
      }

      .stretch:hover > span {
        animation: stretch 450ms ease-in-out;
      }

      .slide:hover > span {
        animation: slide 420ms ease-out;
      }

      .tilt:hover > span {
        animation: tilt 500ms ease-in-out;
      }

      .pulse:hover > span {
        animation: pulse 650ms ease-in-out infinite;
      }

      .fall:hover > span {
        animation: fall 500ms ease-in;
      }

      .rise:hover > span {
        animation: rise 500ms ease-out;
      }

      .zigzag:hover > span {
        animation: zigzag 650ms linear;
      }

      @keyframes wobble {
        0%,
        100% {
          transform: rotate(0deg);
        }

        25% {
          transform: rotate(-10deg);
        }

        75% {
          transform: rotate(10deg);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes short-movement {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(18px, -10px);
        }
      }

      @keyframes jump {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(0, -28px);
        }
      }

      @keyframes squash {
        0%,
        100% {
          transform: scale(1);
        }

        35% {
          transform: scale(1.35, 0.7);
        }

        70% {
          transform: scale(0.8, 1.3);
        }
      }

      @keyframes orbit {
        0% {
          transform: translate(0, 0);
        }

        25% {
          transform: translate(10px, -10px);
        }

        50% {
          transform: translate(20px, 0);
        }

        75% {
          transform: translate(10px, 10px);
        }

        100% {
          transform: translate(0, 0);
        }
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0;
        }
      }

      @keyframes flip {
        0%,
        100% {
          transform: rotateY(0deg);
        }

        50% {
          transform: rotateY(180deg);
        }
      }

      @keyframes stretch {
        0%,
        100% {
          transform: scaleX(1);
        }

        50% {
          transform: scaleX(1.8);
        }
      }

      @keyframes slide {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(-36px, 0);
        }
      }

      @keyframes tilt {
        0%,
        100% {
          transform: skew(0deg);
        }

        50% {
          transform: skew(-18deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.25);
        }
      }

      @keyframes fall {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(0, 34px) rotate(12deg);
        }
      }

      @keyframes rise {
        0%,
        100% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(0, -38px) scale(0.9);
        }
      }

      @keyframes zigzag {
        0%,
        100% {
          transform: translate(0, 0);
        }

        20% {
          transform: translate(12px, -8px);
        }

        40% {
          transform: translate(-12px, -16px);
        }

        60% {
          transform: translate(12px, -24px);
        }

        80% {
          transform: translate(-12px, -8px);
        }
      }

      .guestbook-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 20;
        display: none;
        width: min(430px, calc(100vw - 88px));
        height: min(54vh, 440px);
        transform: translate(-50%, -50%);
        background: #fff;
        border: 1px solid #111;
        box-shadow: none;
      }

      .guestbook-popup.is-open {
        display: block;
      }

      .guestbook-popup-bar {
        display: flex;
        justify-content: flex-start;
        padding: 6px 6px 0;
        cursor: move;
        user-select: none;
      }

      .guestbook-popup-close {
        font: inherit;
        background: #fff;
        border: 1px solid #111;
        padding: 2px 8px;
        transition: transform 140ms ease, letter-spacing 140ms ease, box-shadow 140ms ease;
      }

      .guestbook-popup-close:hover {
        letter-spacing: 0.08em;
        box-shadow: 3px 3px 0 #111;
        transform: rotate(-3deg);
      }

      .guestbook-popup-close:active {
        box-shadow: none;
        transform: translate(2px, 2px) rotate(0deg);
      }

      .guestbook-popup iframe {
        display: block;
        width: 100%;
        height: calc(100% - 31px);
        border: 0;
      }

      .guestbook-popup-backdrop {
        position: fixed;
        inset: 0;
        z-index: 19;
        display: none;
        background: transparent;
      }

      .guestbook-popup-backdrop.is-open {
        display: block;
      }

      .hello-bubble {
        position: fixed;
        z-index: 18;
        display: none;
        max-width: 260px;
        padding: 10px 12px;
        background: #fff;
        border: 2px solid #111;
        box-shadow: 4px 4px 0 #111;
        font-family: "Courier New", monospace;
        line-height: 1.3;
      }

      .hello-bubble-message {
        display: grid;
        gap: 4px;
      }

      .hello-bubble-text {
        min-height: 3.9em;
      }

      .hello-bubble-cursor {
        display: inline-block;
        margin-left: 1px;
        animation: hello-cursor-blink 900ms steps(2, jump-none) infinite;
      }

      .hello-bubble.is-open {
        display: block;
      }

      .hello-bubble::after {
        content: "";
        position: absolute;
        left: var(--hello-tail-left, 18px);
        top: -10px;
        width: 14px;
        height: 14px;
        background: #fff;
        border-top: 2px solid #111;
        border-left: 2px solid #111;
        transform: rotate(45deg);
      }

      @keyframes hello-cursor-blink {
        0%,
        49% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main links"></nav>
    <div class="hello-bubble" id="hello-bubble" hidden></div>
    <div class="guestbook-popup-backdrop" id="guestbook-backdrop" hidden></div>
    <section class="guestbook-popup" id="guestbook-popup" hidden aria-label="Guestbook popup">
      <div class="guestbook-popup-bar">
        <button class="guestbook-popup-close" id="guestbook-close" type="button">close</button>
      </div>
      <iframe
        id="guestbook-frame"
        src="about:blank"
        title="Guestbook"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </section>

    <script>
      const links = [
        { text: "hello", href: "pages/blog.html", action: "hello" },
        { text: "livecoding", href: "pages/livecoding.html" },
        { text: "zerstreut", href: "pages/photography.html" },
        { text: "pigeons!!!!", href: "pages/pigeons!!!!.html" },
        { text: "tv", href: "pages/tv.html" },
        {
          text: "guestbook",
          href: "https://hon.atabook.org/",
          popup: true
        },
        { text: "plumbing-room", href: "pages/plumbing.html" },
        { text: "distance", href: "pages/keep-your-distance.html" },
        { text: "mathy-stuff", href: "pages/maths.html" }

      ];

      const nav = document.querySelector("nav");
      const helloBubble = document.getElementById("hello-bubble");
      const guestbookPopup = document.getElementById("guestbook-popup");
      const guestbookBackdrop = document.getElementById("guestbook-backdrop");
      const guestbookFrame = document.getElementById("guestbook-frame");
      const guestbookClose = document.getElementById("guestbook-close");
      const guestbookBar = guestbookPopup.querySelector(".guestbook-popup-bar");
      const radius = 350;
      const center = 280;
      const animations = [
        "wobble",
        "spin",
        "short-movement",
        "jump",
        "squash",
        "orbit",
        "blink",
        "flip",
        "stretch",
        "slide",
        "tilt",
        "pulse",
        "fall",
        "rise",
        "zigzag"
      ];
      const guestbookPosition = {
        x: window.innerWidth * 0.78,
        y: window.innerHeight * 0.7
      };
      const helloMessage = "Welcome to my Site! There are many things to explore here (atleast if i finally add more content..)";
      let dragState = null;
      let helloTypeTimer = null;

      function stopHelloTyping() {
        if (helloTypeTimer) {
          window.clearTimeout(helloTypeTimer);
          helloTypeTimer = null;
        }
      }

      function openHelloBubble(anchor) {
        const rect = anchor.getBoundingClientRect();
        stopHelloTyping();
        helloBubble.innerHTML = `<div class="hello-bubble-message"><div class="hello-bubble-text" id="hello-bubble-text"></div></div>`;
        helloBubble.hidden = false;
        helloBubble.classList.add("is-open");

        const bubbleWidth = helloBubble.offsetWidth;
        const left = Math.min(
          Math.max(rect.left + rect.width / 2 - 24, 16),
          window.innerWidth - bubbleWidth - 16
        );
        const top = Math.min(rect.bottom + 20, window.innerHeight - helloBubble.offsetHeight - 16);

        helloBubble.style.left = `${left}px`;
        helloBubble.style.top = `${top}px`;
        helloBubble.style.setProperty(
          "--hello-tail-left",
          `${Math.min(Math.max(rect.left + rect.width / 2 - left - 7, 12), bubbleWidth - 26)}px`
        );

        const helloBubbleText = document.getElementById("hello-bubble-text");
        let index = 0;
        const firstPauseIndex = "Welcome to my Site!".length;
        const secondPauseIndex = "Welcome to my Site! There are many things to explore here ".length;

        function typeNextCharacter() {
          const visibleText = helloMessage.slice(0, index);
          helloBubbleText.innerHTML = `${visibleText}<span class="hello-bubble-cursor">_</span>`;

          if (index < helloMessage.length) {
            let delay = 22;

            if (index === firstPauseIndex) {
              delay = 520;
            } else if (index === secondPauseIndex) {
              delay = 980;
            }

            index += 1;
            helloTypeTimer = window.setTimeout(typeNextCharacter, delay);
            return;
          }

          helloTypeTimer = null;
        }

        typeNextCharacter();
      }

      function closeHelloBubble() {
        stopHelloTyping();
        helloBubble.classList.remove("is-open");
        helloBubble.hidden = true;
      }

      function clampGuestbookPosition() {
        const rect = guestbookPopup.getBoundingClientRect();
        const halfWidth = rect.width / 2;
        const halfHeight = rect.height / 2;
        guestbookPosition.x = Math.min(Math.max(guestbookPosition.x, halfWidth), window.innerWidth - halfWidth);
        guestbookPosition.y = Math.min(Math.max(guestbookPosition.y, halfHeight), window.innerHeight - halfHeight);
      }

      function renderGuestbookPosition() {
        guestbookPopup.style.left = `${guestbookPosition.x}px`;
        guestbookPopup.style.top = `${guestbookPosition.y}px`;
      }

      function openGuestbook(url) {
        if (guestbookFrame.src !== url) {
          guestbookFrame.src = url;
        }

        guestbookPopup.hidden = false;
        guestbookBackdrop.hidden = false;
        guestbookPopup.classList.add("is-open");
        guestbookBackdrop.classList.add("is-open");
        document.body.classList.add("guestbook-open");
        clampGuestbookPosition();
        renderGuestbookPosition();
      }

      function closeGuestbook() {
        guestbookPopup.classList.remove("is-open");
        guestbookBackdrop.classList.remove("is-open");
        guestbookPopup.hidden = true;
        guestbookBackdrop.hidden = true;
        document.body.classList.remove("guestbook-open");
      }

      links.forEach((link, index) => {
        const angle = (index / links.length) * Math.PI * 2 - Math.PI / 2;
        const a = document.createElement("a");
        const label = document.createElement("span");

        a.href = link.href;
        a.className = animations[index % animations.length];
        a.style.left = `${center + Math.cos(angle) * radius}px`;
        a.style.top = `${center + Math.sin(angle) * radius}px`;
        label.textContent = link.text;
        a.appendChild(label);

        if (link.action === "hello") {
          a.addEventListener("click", (event) => {
            event.preventDefault();
            openHelloBubble(a);
          });
        } else if (link.popup) {
          a.addEventListener("click", (event) => {
            event.preventDefault();
            openGuestbook(link.href);
          });
        }

        nav.appendChild(a);
      });

      guestbookClose.addEventListener("click", closeGuestbook);
      guestbookBackdrop.addEventListener("click", closeGuestbook);
      document.addEventListener("mousedown", (event) => {
        if (!helloBubble.classList.contains("is-open")) {
          return;
        }

        if (helloBubble.contains(event.target) || event.target.closest("a")) {
          return;
        }

        closeHelloBubble();
      });

      guestbookBar.addEventListener("mousedown", (event) => {
        if (event.target.closest("button")) {
          return;
        }

        dragState = {
          offsetX: event.clientX - guestbookPosition.x,
          offsetY: event.clientY - guestbookPosition.y
        };
      });

      window.addEventListener("mousemove", (event) => {
        if (!dragState) {
          return;
        }

        guestbookPosition.x = event.clientX - dragState.offsetX;
        guestbookPosition.y = event.clientY - dragState.offsetY;
        clampGuestbookPosition();
        renderGuestbookPosition();
      });

      window.addEventListener("mouseup", () => {
        dragState = null;
      });

      window.addEventListener("resize", () => {
        clampGuestbookPosition();
        renderGuestbookPosition();
      });
    </script>
  </body>
</html>
